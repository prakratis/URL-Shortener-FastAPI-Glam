<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Link Edit | Premium Shortener</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bubbles">
        <div class="bubble" style="width: 80px; height: 80px; left: 10%; animation-delay: 0s;"></div>
        <div class="bubble" style="width: 40px; height: 40px; left: 30%; animation-delay: 2s;"></div>
        <div class="bubble" style="width: 120px; height: 120px; left: 70%; animation-delay: 4s;"></div>
        <div class="bubble" style="width: 60px; height: 60px; left: 90%; animation-delay: 1s;"></div>
        <div class="bubble" style="width: 50px; height: 50px; left: 50%; animation-delay: 3s;"></div>
    </div>

    <div class="dashboard-card">
        <span class="brand-tag">Prakrati Saxena Original</span>
        <h2>The Link Edit</h2>
        <p class="subtitle">Shorten your links with a touch of glam.</p>
        
        <div class="input-container">
            <input type="text" id="longUrl" placeholder="Paste your long link here...">
        </div>
        
        <button onclick="shortenUrl()">Get My Short Link</button>
        
        <div id="result">
            <span class="placeholder-text">Your link will appear here ✨</span>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
